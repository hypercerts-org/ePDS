name: E2E tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep a check run for every PR so branch protection sees an explicit
  # skipped result when the source changes cannot affect ePDS or its tests.
  gate:
    name: gate
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/**'
              - 'e2e/**'
              - 'features/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'Dockerfile.*'
              - 'playwright.config.*'
              - '.github/workflows/e2e-tests.yml'

  run:
    name: run
    needs: gate
    if: >-
      always() &&
      (needs.gate.outputs.relevant == 'true' || github.event_name != 'pull_request')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      actions: read
      pull-requests: read
      checks: write
    steps:
      # Build and test the PR head source rather than GitHub's synthetic
      # merge commit, matching the SHA associated with the check result.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.3

      - name: Seed empty e2e report
        run: |
          mkdir -p reports
          printf '%s' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<testsuites name="e2e" tests="0" failures="0" errors="0" time="0">' \
            '<testsuite name="placeholder (overwritten by cucumber)" tests="0" failures="0" errors="0" skipped="0" time="0"/>' \
            '</testsuites>' \
            > reports/e2e.junit.xml

      - name: Run against private Atmosphere in a Box
        env:
          EPDS_E2E_PROJECT: epds-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          EPDS_E2E_PROFILE: default
          EPDS_E2E_REPORT_DIR: ${{ github.workspace }}/reports
        run: bash e2e/atmosphere/run.sh

      - name: Final scoped Docker cleanup
        if: always()
        env:
          EPDS_E2E_PROJECT: epds-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
            echo "Docker is unavailable; the e2e runner's scoped cleanup trap handled any created resources."
            exit 0
          fi
          project_label="label=com.docker.compose.project=$EPDS_E2E_PROJECT"
          mapfile -t containers < <(docker ps --all --quiet --filter "$project_label")
          if ((${#containers[@]})); then
            docker rm --force "${containers[@]}"
          fi
          mapfile -t networks < <(docker network ls --quiet --filter "$project_label")
          if ((${#networks[@]})); then
            docker network rm "${networks[@]}"
          fi
          mapfile -t volumes < <(docker volume ls --quiet --filter "$project_label")
          if ((${#volumes[@]})); then
            docker volume rm "${volumes[@]}"
          fi
          echo "Scoped cleanup completed for $EPDS_E2E_PROJECT."

      - name: Publish default profile report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: e2e cucumber report
          path: reports/e2e.junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload e2e reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-report
          path: reports/
          retention-days: 2
