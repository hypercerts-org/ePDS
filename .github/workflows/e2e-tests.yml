name: E2E tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep a check run for every PR so branch protection sees an explicit
  # skipped result when the source changes cannot affect ePDS or its tests.
  gate:
    name: gate
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/**'
              - 'e2e/**'
              - 'features/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'Dockerfile.*'
              - 'playwright.config.*'
              - '.github/workflows/e2e-tests.yml'
              - '.github/workflows/e2e-atmosphere.yml'
              - '.github/workflows/e2e-railway.yml'

  atmosphere:
    name: atmosphere
    needs: gate
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main')) &&
      (needs.gate.outputs.relevant == 'true' || github.event_name != 'pull_request')
    uses: ./.github/workflows/e2e-atmosphere.yml
    secrets: inherit

  railway:
    name: railway ${{ github.base_ref }} e2e
    needs: gate
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.gate.outputs.relevant == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.base_ref == 'dev' || github.base_ref == 'production')
    uses: ./.github/workflows/e2e-railway.yml
    secrets: inherit
